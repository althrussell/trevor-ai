resources:
  jobs:
    setup_lakebase:
      name: hermes-setup-lakebase
      tasks:
        - task_key: create_schema_and_grants
          notebook_task:
            notebook_path: ../sql/setup_lakebase.py
            base_parameters:
              # Use the bundle variable directly so this works whether
              # the Lakebase instance is bundle-managed or externally-
              # managed.
              instance_name: ${var.lakebase_instance}
              app_sp_client_id: ${resources.apps.hermes_app.service_principal_client_id}
              schema_name: hermes_session
