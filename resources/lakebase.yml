# Lakebase is intentionally NOT bundle-managed for the free target.
#
# On Databricks Free Edition the workspace is typically capped at a
# single Lakebase instance, and an instance already exists
# (`trevor-db`). The bundle binds to it externally via the
# ``TREVOR_DATABRICKS_LAKEBASE_INSTANCE`` env var declared in
# ``app/app.yaml``; the App SP needs DATABASE_USAGE on the instance.
#
# To let the bundle own the Lakebase instance again, uncomment the
# block below and set ``--var lakebase_instance=<new-name>``.

# resources:
#   database_instances:
#     trevor_db:
#       name: ${var.lakebase_instance}
#       capacity: CU_1
