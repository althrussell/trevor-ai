resources:
  apps:
    hermes_app:
      name: ${var.app_name}
      source_code_path: ../app
      description: "Hermes Agent (${var.agent_name}) running on Databricks Free Edition."
      config:
        env:
          # IMPORTANT: Databricks Apps deployed via DAB only honour env
          # vars declared *here* (under ``config.env``). The top-level
          # ``env:`` block in ``app/app.yaml`` is NOT injected into the
          # running process. Any setting that differs from the
          # ``Config`` dataclass default in ``app/hermes_databricks/config.py``
          # MUST be wired here, or the runtime silently falls back to
          # the dataclass default.
          - name: HERMES_DATABRICKS_LLM_ENDPOINT
            value: ${var.llm_endpoint}
          - name: HERMES_DATABRICKS_LAKEBASE_INSTANCE
            value: ${var.lakebase_instance}
          - name: HERMES_DATABRICKS_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: HERMES_DATABRICKS_MCP_ENABLED
            value: ${var.mcp_enabled}
          # Per-target overrides for the Databricks-ops gates. Defaults
          # in app.yaml are safe (false/false); bundle vars in
          # databricks.yml flip them per target without editing
          # app.yaml at deploy time.
          - name: HERMES_DATABRICKS_WRITES_ENABLED
            value: ${var.writes_enabled}
          - name: HERMES_DATABRICKS_YOLO
            value: ${var.yolo}
      resources:
        - name: hermes-home-volume
          uc_securable:
            securable_full_name: ${resources.volumes.hermes_home_volume.id}
            securable_type: VOLUME
            permission: WRITE_VOLUME

        - name: hermes-artifacts-volume
          uc_securable:
            securable_full_name: ${resources.volumes.hermes_artifacts_volume.id}
            securable_type: VOLUME
            permission: WRITE_VOLUME

        - name: llm-endpoint
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY

        # SQL warehouse used by databricks_uc_query_readonly and
        # databricks_sql_execute. CAN_USE is the minimum permission
        # needed for the App SP to execute statements; access to the
        # underlying tables is governed by Unity Catalog (see
        # `sql/setup_grants.py` for the catalog/schema GRANTs).
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

        # Lakebase Postgres instance binding. Gives the App SP CAN_USE
        # on the instance so the SDK-driven session DB connector and
        # any skills that touch Lakebase (e.g. databricks-lakebase-*)
        # can authenticate without manual privilege juggling. On Free
        # Edition the instance is read-only via the SDK in some tiers
        # — the binding is still safe to declare.
        - name: lakebase-instance
          database:
            database_name: ${var.lakebase_database}
            instance_name: ${var.lakebase_instance}
            permission: CAN_CONNECT_AND_CREATE

        # Telegram secret bindings. The ``hermes_agent`` scope must
        # exist with these three keys BEFORE deploy:
        #   databricks secrets create-scope hermes_agent
        #   databricks secrets put-secret hermes_agent telegram_bot_token              --string-value '<botfather token>'
        #   databricks secrets put-secret hermes_agent telegram_primary_user_handle    --string-value '<your_handle>'
        #   databricks secrets put-secret hermes_agent telegram_allowed_users          --string-value 'handle_a,handle_b'
        # If the scope is missing the bundle deploy will fail with an
        # unresolvable secret-resource error.

        - name: telegram-bot-token
          secret:
            scope: ${var.secrets_scope}
            key: telegram_bot_token
            permission: READ

        - name: telegram-user-handle
          secret:
            scope: ${var.secrets_scope}
            key: telegram_primary_user_handle
            permission: READ

        - name: telegram-allowed-users
          secret:
            scope: ${var.secrets_scope}
            key: telegram_allowed_users
            permission: READ
