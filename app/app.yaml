command:
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
  - "--loop"
  - "asyncio"

env:
  # Identification
  - name: TREVOR_DATABRICKS_AGENT_NAME
    value: "Hermes"

  # Model serving
  - name: TREVOR_DATABRICKS_LLM_ENDPOINT
    value: "databricks-qwen35-122b-a10b"

  # Unity Catalog
  - name: TREVOR_DATABRICKS_CATALOG
    value: "workspace"
  - name: TREVOR_DATABRICKS_SCHEMA
    value: "trevor_agent"
  - name: TREVOR_DATABRICKS_HERMES_HOME_VOLUME
    value: "trevor_home"
  - name: TREVOR_DATABRICKS_ARTIFACTS_VOLUME
    value: "trevor_artifacts"

  # Lakebase
  - name: TREVOR_DATABRICKS_LAKEBASE_INSTANCE
    value: "trevor-db"
  - name: TREVOR_DATABRICKS_LAKEBASE_SCHEMA
    value: "trevor_session"

  # Secrets scope
  - name: TREVOR_DATABRICKS_SECRETS_SCOPE
    value: "trevor_agent"

  # Behavior
  - name: TREVOR_DATABRICKS_DAILY_TOKEN_CAP
    value: "100000"
  - name: TREVOR_DATABRICKS_HEARTBEAT_SECONDS
    value: "180"

  # Channels
  - name: TREVOR_DATABRICKS_TELEGRAM_ENABLED
    value: "true"

  # Tool backends
  - name: TREVOR_DATABRICKS_TERMINAL_BACKEND
    value: "in_app_subprocess"
  - name: TREVOR_DATABRICKS_BROWSER_BACKEND
    value: "disabled"
  - name: TREVOR_DATABRICKS_MCP_ENABLED
    value: "false"

  # SQL Warehouse for databricks_uc_query_readonly + databricks_sql_execute
  - name: TREVOR_DATABRICKS_WAREHOUSE_ID
    value: "9a444167489c1f75"

  # Databricks-ops gates (see docs/DATABRICKS_OPS.md)
  #
  # WRITES_ENABLED:
  #   false (default) → all mutating primitives reject with {"error":"writes_disabled"};
  #                      reads (databricks_uc_query_readonly, databricks_volume_read, ...) still work.
  #   true            → DML and non-destructive DDL allowed; destructive verbs still need YOLO.
  #
  # YOLO:
  #   false (default) → destructive verbs (DROP, TRUNCATE, DELETE-without-WHERE,
  #                      volume delete, force-overwrite) are rejected with
  #                      {"error":"yolo_required"}.
  #   true            → everything goes. Each such call is logged as
  #                      agent_events kind="dbx_yolo_call".
  - name: TREVOR_DATABRICKS_WRITES_ENABLED
    value: "false"
  - name: TREVOR_DATABRICKS_YOLO
    value: "false"
  # Override these CSVs to widen or narrow what the mutating primitives accept.
  # When unset, defaults to the bundle's own catalog/schema and bundle-managed
  # volumes (resolved in trevor_databricks.config.load()).
  # - name: TREVOR_DATABRICKS_WRITE_ALLOWED_SCHEMAS
  #   value: "workspace.trevor_agent.*"
  # - name: TREVOR_DATABRICKS_WRITE_ALLOWED_VOLUMES
  #   value: "/Volumes/workspace/trevor_agent/trevor_home,/Volumes/workspace/trevor_agent/trevor_artifacts"

  # Hermes home (the local cache; durable mirror lives in UC Volume)
  - name: HERMES_HOME
    value: "/tmp/trevor_cache/trevor_home"

  # Quiet Hermes' setup-wizard prompts
  - name: HERMES_NONINTERACTIVE
    value: "1"
