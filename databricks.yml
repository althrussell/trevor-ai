# Trevor-on-Databricks Asset Bundle
#
# Deploys the full Hermes Agent runtime (hermes-agent==0.14.0) as a
# Databricks App backed by Lakebase Postgres for session state and
# UC Volumes for HERMES_HOME (skills, cron, memories, artifacts).
#
# Usage:
#   databricks auth login --host <workspace-url> --profile trevor-free
#   databricks bundle validate -t free
#   databricks bundle deploy   -t free
#   databricks bundle run setup_lakebase -t free
#   databricks bundle run trevor_app     -t free

bundle:
  name: trevor-on-databricks

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog name that owns the schema/volumes.
    default: workspace

  schema:
    description: UC schema name for Trevor-owned objects.
    default: trevor_agent

  app_name:
    description: Databricks App name (slug).
    default: trevor-agent

  agent_name:
    description: Display name for the Hermes agent.
    default: Hermes

  llm_endpoint:
    description: Databricks Model Serving endpoint name to use as the default model.
    default: databricks-qwen35-122b-a10b

  secrets_scope:
    description: Databricks Secrets scope holding Telegram token + optional provider keys.
    default: trevor_agent

  lakebase_instance:
    description: Lakebase database instance name. Must match TREVOR_DATABRICKS_LAKEBASE_INSTANCE in app/app.yaml.
    default: trevor-db

  lakebase_database:
    description: Lakebase Postgres database name inside the instance.
    default: databricks_postgres

  trevor_home_volume:
    description: UC Volume name backing HERMES_HOME (config, skills, cron, memories, logs).
    default: trevor_home

  artifacts_volume:
    description: UC Volume name for agent-generated artifacts and notes.
    default: trevor_artifacts

  warehouse_id:
    description: Optional SQL Warehouse ID used by the databricks_uc_query_readonly tool. Leave empty to disable.
    default: ""

  daily_token_cap:
    description: Soft daily token cap (informational; enforced by runtime).
    default: 200000

  heartbeat_seconds:
    description: Seconds between agent heartbeats (idle reflection + UC sync).
    default: 180

  terminal_backend:
    description: One of in_app_subprocess|databricks_job|external_sandbox|disabled.
    default: in_app_subprocess

  browser_backend:
    description: One of disabled|in_app_playwright|databricks_job_browser|external_browser.
    default: disabled

  mcp_enabled:
    description: |
      Whether to enable MCP tools. When true, the runtime writes
      HERMES_HOME/config.yaml with the Databricks managed SQL MCP
      server (https://<workspace>/api/2.0/mcp/sql) wired up using the
      App service principal's bearer token.
    default: "true"

  telegram_enabled:
    description: Whether to start the Telegram long-polling loop at boot.
    default: "true"

  writes_enabled:
    description: |
      Master switch for mutating Databricks primitives (databricks_sql_execute,
      databricks_volume_write, ...). When "false" the tools are registered but
      reject with {"error":"writes_disabled"}. See docs/DATABRICKS_OPS.md.
    default: "false"

  yolo:
    description: |
      When writes are enabled, additionally allow destructive verbs (DROP,
      TRUNCATE, DELETE-without-WHERE, volume delete, force-overwrite). Logged
      as agent_events kind="dbx_yolo_call". NEVER true on the free target.
    default: "false"

targets:
  free:
    default: true
    workspace:
      # No host pinned; uses the active Databricks CLI profile.
      profile: trevor-free
    variables:
      heartbeat_seconds: 180
      daily_token_cap: 100000
      # The shared "Serverless Starter Warehouse" on the Free Edition
      # workspace. Override via --var warehouse_id=<id> if it changes.
      warehouse_id: "9a444167489c1f75"
      # Free Edition stays read-only by default: no broad privilege escalation
      # on the shared Free workspace. Operator can flip per-deploy via --var.
      writes_enabled: "false"
      yolo: "false"

  dev:
    workspace:
      profile: trevor-dev
    variables:
      heartbeat_seconds: 60
      # Dev opts into mutating primitives but never YOLO by default.
      writes_enabled: "true"
      yolo: "false"

  prod:
    mode: production
    workspace:
      profile: trevor-prod
    variables:
      heartbeat_seconds: 300
      daily_token_cap: 1000000
      # Prod opts into mutating primitives; destructive ops still need a
      # deliberate --var yolo=true on the deploy command.
      writes_enabled: "true"
      yolo: "false"
