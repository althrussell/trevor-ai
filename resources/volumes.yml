resources:
  volumes:
    trevor_home_volume:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.trevor_schema.name}
      name: ${var.trevor_home_volume}
      volume_type: MANAGED
      comment: "Durable HERMES_HOME: config.yaml, skills/, cron/, memories/, logs/curator, image_cache/, audio_cache/, mcp-tokens/."

    trevor_artifacts_volume:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.trevor_schema.name}
      name: ${var.artifacts_volume}
      volume_type: MANAGED
      comment: "Agent-generated artifacts and operator notes."
