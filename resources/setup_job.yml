resources:
  jobs:
    setup_lakebase:
      name: hermes-setup-lakebase
      tasks:
        - task_key: create_schema_and_grants
          notebook_task:
            notebook_path: ../sql/setup_lakebase.py
            base_parameters:
              instance_name: ${resources.database_instances.hermes_db.name}
              app_sp_client_id: ${resources.apps.hermes_app.service_principal_client_id}
              schema_name: hermes_session
